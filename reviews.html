<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviews — GradSnaps</title>
<link rel="icon" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="reviews">
<nav id="nav"></nav>
<section class="first">
  <div class="eyebrow">Reviews</div>
  <h2>Kind words from graduates</h2>
  <div class="rv" id="rv"></div>
  <div class="rform">
    <h3 style="font-size:30px">Shot with us? Leave a review</h3>
    <label>Your name</label><input id="rn">
    <label>Rating</label><select id="rr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
    <label>Your review</label><textarea id="rt" rows="4"></textarea>
    <button class="btn solid" style="margin-top:14px" onclick="sendReview()">Send Review</button>
  </div>
</section>
<footer>© 2026 GradSnaps · Capturing graduation memories</footer>
<script src="site-data.js"></script>
<script src="site.js"></script>
</body>
</html>
